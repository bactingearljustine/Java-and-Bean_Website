<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java & Beans — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-float" aria-hidden="true">
  <span>☕</span><span>🍩</span><span>🥐</span>
  <span>🍫</span><span>🧋</span><span>🍵</span>
  <span>☕</span><span>🫖</span><span>🍩</span><span>🥐</span>
</div>
  <nav class="navbar">
    <div class="logo"><span>☕</span> Java & Beans</div>
    <div class="nav-links">
      <a href="dashboard.html" class="active">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html">Cart <span class="cart-badge" id="cart-count">0</span></a>

  <div class="page">

        <a href="menu.html" class="btn-secondary">Browse the Menu</a>

    <div class="quick-links">
      <a href="menu.html" class="quick-card">

      </a>
      <a href="cart.html" class="quick-card">
        <span class="qc-icon">🛒</span>
        <div class="qc-title">Your Cart</div>
        <div class="qc-desc">Review & checkout</div>

      <div class="quick-card" style="cursor:default;">
        <span class="qc-icon">⭐</span>
        <div class="qc-title">Favorites</div>
        <div class="qc-desc">Coming soon!</div>
      </div>
    </div>
  </div>
