<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java & Beans — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-float" aria-hidden="true">
  <span>☕</span><span>🍩</span><span>🥐</span>
  <span>🍫</span><span>🧋</span><span>🍵</span>
  <span>☕</span><span>🫖</span><span>🍩</span><span>🥐</span>
</div>
  <nav class="navbar">
    <div class="logo"><span>☕</span> Java & Beans</div>
    <div class="nav-links">
      <a href="dashboard.html">Home</a>
      <a href="menu.html">Menu</a>
      <a href="cart.html" class="active">Cart <span class="cart-badge" id="cart-count">0</span></a>
      <button class="logout-btn" id="logout-btn">Sign out</button>
    </div>
  </nav>

  <div class="page">
    <h1 class="page-heading">Your Cart</h1>
    <p class="page-subheading">Almost there — review your order below</p>

    <div class="cart-layout">
      <div class="cart-items-box" id="cart-items">
        <!-- filled by script.js -->
      </div>

      <div class="cart-summary">
        <h2>Order Summary</h2>
        <div id="summary-rows"></div>
        <div class="summary-row">
          <span>Total</span>
          <span id="total-price">₱0</span>
        </div>
        <button class="btn-checkout" onclick="checkout()">Place Order ✓</button>
        <a href="menu.html" style="display:block; text-align:center; margin-top:0.8rem; font-size:0.85rem; color:var(--text-muted); text-decoration:none;">+ Add more items</a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
