<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java & Beans — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-float" aria-hidden="true">
  <span>☕</span><span>🍩</span><span>🥐</span>
  <span>🍫</span><span>🧋</span><span>🍵</span>
  <span>☕</span><span>🫖</span><span>🍩</span><span>🥐</span>
</div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="cup-icon">☕</span>
        <h1>Java & Beans</h1>
        <p>Welcome back, coffee lover!</p>
      </div>

      <div class="field">
        <label for="login-user">Username</label>
        <input type="text" id="login-user" placeholder="your_username">
      </div>

      <div class="field">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" placeholder="••••••••">
      </div>

      <button class="btn-primary" id="login-btn">Sign In</button>

      <p class="auth-footer">
        No account yet? <a href="register.html">Create one here</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
