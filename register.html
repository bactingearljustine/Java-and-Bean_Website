<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java & Beans — Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-float" aria-hidden="true">
  <span>☕</span><span>🍩</span><span>🥐</span>
  <span>🍫</span><span>🧋</span><span>🍵</span>
  <span>☕</span><span>🫖</span><span>🍩</span><span>🥐</span>
</div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="cup-icon">🌱</span>
        <h1>Join Us</h1>
        <p>Create your Java & Beans account</p>
      </div>

      <div class="field">
        <label for="reg-user">Username</label>
        <input type="text" id="reg-user" placeholder="choose_a_username">
      </div>

      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@email.com">
      </div>

      <div class="field">
        <label for="reg-pass">Password</label>
        <input type="password" id="reg-pass" placeholder="••••••••">
      </div>

      <button class="btn-primary" id="register-btn">Create Account</button>

      <p class="auth-footer">
        Already have an account? <a href="index.html">Sign in here</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
